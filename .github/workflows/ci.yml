name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Assistant catalog tests
        run: npm run assistant:test

      - name: Production build
        # Placeholders written to .env so the build's CSP step always has a
        # parseable URL. This artifact is never published; real values come
        # from the developer's own .env at release time.
        run: |
          printf 'VITE_SUPABASE_URL=https://placeholder.supabase.co\nVITE_SUPABASE_ANON_KEY=placeholder-anon-key\n' > .env
          npm run build
